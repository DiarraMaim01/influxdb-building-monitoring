
services:
  influxdb3-core:
    image: influxdb:3-core
    container_name: influxdb3-core
    ports:
      - "127.0.0.1:8181:8181"
    command:
      - influxdb3
      - serve
      - --node-id=node0
      - --object-store=file
      - --data-dir=/var/lib/influxdb3/data
      - --plugin-dir=/var/lib/influxdb3/plugins
      - --admin-token-recovery-http-bind
    volumes:
      - ./data:/var/lib/influxdb3/data
      - ./plugins:/var/lib/influxdb3/plugins
    restart: unless-stopped
  explorer:
    image: influxdata/influxdb3-ui:1.11.2
    container_name: influxdb3-explorer
    ports:
      - "127.0.0.1:8888:8080"
    command:
      - --mode=admin  
    restart: unless-stopped